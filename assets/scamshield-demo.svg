<circle cx="21" cy="5" r="6" fill="#d1242f" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.4182;0.9636;1" calcMode="discrete" dur="11.0s" repeatCount="indefinite" /></circle>
<text x="21" y="8.5" text-anchor="middle" font-family="Arial" font-weight="700" font-size="9" fill="#fff" opacity="0">!<animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.4182;0.9636;1" calcMode="discrete" dur="11.0s" repeatCount="indefinite" /></text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.2727;0.9273;1" calcMode="discrete" dur="11.0s" repeatCount="indefinite" />
<rect x="0" y="76" width="640" height="56" fill="#003087"/>
<text class="logo" x="24" y="112">PayPaI</text>
<rect x="170.0" y="160" width="300" height="200" rx="10" fill="#ffffff" stroke="#d0d7de"/>
