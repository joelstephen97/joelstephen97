<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
<title id="t">ScamShield catching a phishing page</title>
<desc id="d">A browser window loads a fake PayPal login on a look-alike domain; ScamShield flags it as a dangerous page and offers a one-click link to the real site.</desc>
<defs>
<clipPath id="win"><rect width="640" height="400" rx="14"/></clipPath>
<clipPath id="page"><rect x="0" y="76" width="640" height="324"/></clipPath>
<clipPath id="urlclip"><rect x="0" y="0" width="0" height="20"><animate attributeName="width" values="0;7.2;14.4;21.6;28.8;36.0;43.2;50.4;57.6;64.8;72.0;79.2;86.4;93.6;100.8;108.0;115.2;122.4;129.6;136.8;144.0;151.2;158.4;165.6;172.8;180.0;187.2;194.4;201.6;208.8;216.0;223.2;230.4;237.6;244.8;252.0;259.2;266.4;273.6;0;0" keyTimes="0.0000;0.0416;0.0469;0.0522;0.0574;0.0627;0.0679;0.0732;0.0785;0.0837;0.0890;0.0943;0.0995;0.1048;0.1100;0.1153;0.1206;0.1258;0.1311;0.1364;0.1416;0.1469;0.1522;0.1574;0.1627;0.1679;0.1732;0.1785;0.1837;0.1890;0.1943;0.1995;0.2048;0.2100;0.2153;0.2206;0.2258;0.2311;0.2364;0.9636;1" calcMode="discrete" dur="11.0s" repeatCount="indefinite" /></rect></clipPath>
<linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#cf222e"/><stop offset="1" stop-color="#a40e26"/></linearGradient>
</defs>
<style>.t{font:500 12px 'Cascadia Code', 'Fira Code', Consolas, 'SF Mono', Menlo, monospace;fill:#24292f}.h{font:700 15px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#ffffff}.b{font:500 12px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#ffffff}.lbl{font:500 11px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#57606a}.btn{font:600 12px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#ffffff}.logo{font:800 18px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#ffffff;letter-spacing:-.3px}.small{font:500 10px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;fill:#57606a}.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.pulse{animation:pp 1.6s ease-in-out infinite}@keyframes pp{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@media (prefers-reduced-motion:reduce){.cur,.pulse{animation:none}}</style>
<g clip-path="url(#win)">
<rect width="640" height="400" fill="#ffffff"/>
<rect width="640" height="76" fill="#eef1f4"/>
<circle cx="18" cy="18" r="5" fill="#ff5f57"/><circle cx="36" cy="18" r="5" fill="#febc2e"/><circle cx="54" cy="18" r="5" fill="#28c840"/>
