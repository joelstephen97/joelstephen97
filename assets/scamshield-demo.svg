<rect class="cur" y="3" width="7" height="15" fill="#24292f"><animate attributeName="x" values="0;7.2;14.4;21.6;28.8;36.0;43.2;50.4;57.6;64.8;72.0;79.2;86.4;93.6;100.8;108.0;115.2;122.4;129.6;136.8;144.0;151.2;158.4;165.6;172.8;180.0;187.2;194.4;201.6;208.8;216.0;223.2;230.4;237.6;244.8;252.0;259.2;266.4;273.6;0;0" keyTimes="0.0000;0.0416;0.0469;0.0522;0.0574;0.0627;0.0679;0.0732;0.0785;0.0837;0.0890;0.0943;0.0995;0.1048;0.1100;0.1153;0.1206;0.1258;0.1311;0.1364;0.1416;0.1469;0.1522;0.1574;0.1627;0.1679;0.1732;0.1785;0.1837;0.1890;0.1943;0.1995;0.2048;0.2100;0.2153;0.2206;0.2258;0.2311;0.2364;0.9636;1" calcMode="discrete" dur="11.0s" repeatCount="indefinite" /></rect></g>
<g transform="translate(580,43)">
