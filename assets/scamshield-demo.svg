</g>
<rect x="0" y="76" width="640" height="324" fill="#0b1220" opacity="0"><animate attributeName="opacity" values="0;.45;0;0" keyTimes="0.0000;0.4182;0.9273;1" calcMode="discrete" dur="11.0s" repeatCount="indefinite" /></rect>
<g clip-path="url(#page)">
<g transform="translate(0,-90)"><animateTransform attributeName="transform" type="translate" values="0 -90;0 -90;0 76;0 76;0 -90;0 -90" keyTimes="0;0.4182;0.4591;0.9273;0.9545;1" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;.4 0 1 1;0 0 1 1" dur="11.0s" repeatCount="indefinite"/>
<rect x="0" y="0" width="640" height="84" fill="url(#red)"/>
<g transform="translate(20,22)"><path d="M20 2 36 8v10c0 9-6.4 16.3-16 19.6C10.4 34.3 4 27 4 18V8l16-6z" fill="#fff" opacity=".95"/><path d="M20 12v9M20 26.5v1" stroke="#cf222e" stroke-width="3.2" stroke-linecap="round"/></g>
<text class="h" x="70" y="32">Dangerous page</text>
<text class="b" x="70" y="52">Looks like PayPal, but this is not paypal.com.</text>
<g transform="translate(444,22)"><g class="pulse" style="transform-box:fill-box;transform-origin:center"><rect width="176" height="34" rx="17" fill="#ffffff"/><text class="btn" x="88" y="22" text-anchor="middle" style="fill:#cf222e">Take me to the real site →</text></g></g>
</g></g>
<text class="small" x="320.0" y="390" text-anchor="middle" opacity="0">on-device verdict · nothing sent anywhere<animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.4727;0.9273;1" calcMode="discrete" dur="11.0s" repeatCount="indefinite" /></text>
</g>
<rect x=".5" y=".5" width="639" height="399" rx="14" fill="none" stroke="#30363d" stroke-opacity=".35"/>
</svg>