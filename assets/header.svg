<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Joel Stephen — Full-Stack &amp; AI Engineer</title>
  <desc id="desc">Header banner: Joel Stephen, full-stack and AI engineer in Abu Dhabi. Web products end to end, with the model inside.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101a30"/>
      <stop offset="1" stop-color="#0c1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f78166" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f78166" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#58a6ff" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="300" rx="18"/></clipPath>
    <style>
      .name { font: 700 58px "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #f0f6fc; letter-spacing: -0.5px; }
      .role { font: 500 24px "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #9ecbff; }
      .tag  { font: 400 17px "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #8b98a9; }
      .mono { font: 500 13px "Cascadia Code", "Fira Code", Consolas, "SF Mono", Menlo, monospace; fill: #7ee787; }
      .edge { stroke: #58a6ff; stroke-opacity: 0.35; stroke-width: 1.4; fill: none; }
      .pulse { stroke: url(#accent); stroke-width: 2; fill: none; stroke-dasharray: 26 420; stroke-linecap: round; animation: flow 5.5s linear infinite; }
      .pulse.p2 { animation-delay: -1.8s; }
      .pulse.p3 { animation-delay: -3.4s; }
      .node { fill: #0f1a2e; stroke: #58a6ff; stroke-width: 1.6; }
      .node.hot { stroke: #f78166; }
      .core { fill: #58a6ff; animation: breathe 3.2s ease-in-out infinite; transform-origin: 905px 150px; }
      .ring { fill: none; stroke: #58a6ff; stroke-opacity: 0.25; stroke-width: 1; stroke-dasharray: 4 8; animation: spin 40s linear infinite; transform-origin: 905px 150px; }
      .ring.r2 { stroke-opacity: 0.16; stroke-dasharray: 2 10; animation-duration: 70s; animation-direction: reverse; }
      .bar { animation: slide 6s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -446; } }
      @keyframes breathe { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: 0.75; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes slide { 0%,100% { transform: translateX(0); } 50% { transform: translateX(40px); } }
      @media (prefers-reduced-motion: reduce) { .pulse, .core, .ring, .bar { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <circle cx="980" cy="60" r="260" fill="url(#glowA)"/>
    <circle cx="120" cy="300" r="220" fill="url(#glowB)"/>

    <!-- left: identity -->
    <rect class="bar" x="64" y="76" width="56" height="4" rx="2" fill="url(#accent)"/>
    <text class="name" x="64" y="140">Joel Stephen</text>
    <text class="role" x="66" y="178">Full-Stack &amp; AI Engineer</text>
    <text class="tag"  x="66" y="212">Web products end to end, with the model inside. Abu Dhabi, UAE.</text>
    <text class="mono" x="66" y="250">react · vue · typescript · python · fastapi · llm pipelines · on-device ml</text>

    <!-- right: workflow graph -->
    <g transform="translate(0,0)">
      <circle class="ring" cx="905" cy="150" r="96"/>
      <circle class="ring r2" cx="905" cy="150" r="128"/>

      <!-- edges (static) -->
      <path class="edge" d="M760 90 C 820 90, 840 150, 905 150"/>
      <path class="edge" d="M760 210 C 820 210, 840 150, 905 150"/>
      <path class="edge" d="M905 150 C 960 150, 990 80, 1050 80"/>
      <path class="edge" d="M905 150 C 960 150, 990 220, 1050 220"/>
      <path class="edge" d="M1050 80 C 1090 80, 1110 150, 1140 150"/>
      <path class="edge" d="M1050 220 C 1090 220, 1110 150, 1140 150"/>

      <!-- edges (animated pulses along the same paths) -->
      <path class="pulse" d="M760 90 C 820 90, 840 150, 905 150 C 960 150, 990 80, 1050 80 C 1090 80, 1110 150, 1140 150"/>
      <path class="pulse p2" d="M760 210 C 820 210, 840 150, 905 150 C 960 150, 990 220, 1050 220 C 1090 220, 1110 150, 1140 150"/>
      <path class="pulse p3" d="M760 90 C 820 90, 840 150, 905 150 C 960 150, 990 220, 1050 220 C 1090 220, 1110 150, 1140 150"/>

      <!-- nodes -->
      <circle class="node" cx="760" cy="90" r="9"/>
      <circle class="node" cx="760" cy="210" r="9"/>
      <circle class="node hot" cx="1050" cy="80" r="9"/>
      <circle class="node" cx="1050" cy="220" r="9"/>
      <circle class="node" cx="1140" cy="150" r="9"/>
      <circle class="core" cx="905" cy="150" r="12"/>
      <circle cx="905" cy="150" r="22" fill="none" stroke="#58a6ff" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>

    <!-- bottom hairline -->
    <rect x="0" y="296" width="1200" height="4" fill="url(#accent)" opacity="0.9"/>
  </g>
</svg>
